services:
  # ── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: scinetwork_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-939339}
      MYSQL_DATABASE: ${MYSQL_DBNAME:-polteksmt6}
      MYSQL_USER: netmon
      MYSQL_PASSWORD: netmon123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/mysql.sql:/docker-entrypoint-initdb.d/01_init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ClickHouse ───────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: scinetwork_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: netmon
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "9000:9000"   # native protocol
      - "8123:8123"   # HTTP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/migrations/clickhouse.sql:/docker-entrypoint-initdb.d/01_init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── App (Unified Go Fiber Backend + Frontend Static) ─────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scinetwork_app
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP_PORT: 3535
      MYSQL_HOST: mysql
      CLICKHOUSE_HOST: clickhouse
      ANOMALY_SIDECAR_URL: http://ml-sidecar:8001
    ports:
      - "3535:3535"
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    cap_add:
      - NET_RAW   # Diperlukan untuk ICMP ping

  # ── ML Sidecar ──────────────────────────────────────────────────────────────
  ml-sidecar:
    build:
      context: ./machinelearning/isolationforest
      dockerfile: Dockerfile
    container_name: scinetwork_ml_sidecar
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/models/latest
      MODEL_FALLBACK_PATH: /app/models/model_latest.joblib
      MODEL_METADATA_PATH: /app/models/model_latest.json
    ports:
      - "8001:8001"
    volumes:
      - ./machinelearning/isolationforest/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  clickhouse_data:
